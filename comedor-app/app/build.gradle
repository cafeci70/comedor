apply plugin: 'com.android.application'

// URL base de la API. En producción basta con cambiar API_BASE_URL en gradle.properties
// (o la variable de entorno COMEDOR_API_URL); no hace falta tocar código.
def prodBaseUrl = System.getenv('COMEDOR_API_URL') ?: (project.findProperty('API_BASE_URL') ?: 'https://comedor.example.com')
def devBaseUrl = System.getenv('COMEDOR_API_URL_DEBUG') ?: (project.findProperty('API_BASE_URL_DEBUG') ?: 'http://10.0.2.2')

// Firma del release (opcional). Sin estas variables el build genera
// app-release-unsigned.apk; con ellas genera app-release.apk firmado.
// La clave nunca se guarda en el repositorio.
def keystorePath = System.getenv('COMEDOR_KEYSTORE')
def storePass = System.getenv('COMEDOR_STORE_PASSWORD')
def keyPass = System.getenv('COMEDOR_KEY_PASSWORD')
def ksAlias = System.getenv('COMEDOR_KEY_ALIAS') ?: 'comedor'
def signingReady = keystorePath && storePass && keyPass && file(keystorePath).exists()
logger.lifecycle(signingReady ? 'Comedor: firma de release ACTIVADA' : 'Comedor: firma de release desactivada (APK sin firmar)')

android {
    namespace 'com.ejemplo.comedor'
    compileSdk 34

    defaultConfig {
        applicationId "com.ejemplo.comedor"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "API_BASE_URL", "\"${prodBaseUrl}\""
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        if (signingReady) {
            release {
                storeFile file(keystorePath)
                storePassword storePass
                keyAlias ksAlias
                keyPassword keyPass
            }
        }
    }

    buildTypes {
        debug {
            buildConfigField "String", "API_BASE_URL", "\"${devBaseUrl}\""
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingReady) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'com.google.android.material:material:1.11.0'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'

    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.github.kenglxn.QRGen:android:2.6.0'
}
